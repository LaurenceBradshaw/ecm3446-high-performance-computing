# ============================================================
# Language
# ============================================================
language                          = C
input_tab_size                    = 4
output_tab_size                   = 4
indent_with_tabs                  = 0

# ============================================================
# Indentation
# ============================================================
indent_columns                    = 4
indent_switch_case                = 4
indent_case_brace                 = 0
indent_brace                      = 0
indent_access_spec                = 0
indent_paren_close                = 0
indent_continue                   = 4

# ============================================================
# Braces (Allman style)
# ============================================================
nl_if_brace                       = force
nl_for_brace                      = force
nl_while_brace                    = force
nl_do_brace                       = force
nl_switch_brace                   = force
nl_func_brace                     = force
nl_enum_brace                     = force
nl_struct_brace                   = force
nl_union_brace                    = force

nl_else_brace                     = force
nl_brace_else                     = force
nl_brace_while                    = force

nl_empty_func                     = force
nl_empty_struct                   = force
nl_empty_enum                     = force

# ============================================================
# Spacing
# ============================================================
sp_inside_paren                   = force
sp_inside_sparen                  = force
sp_inside_fparen                  = force
sp_inside_brackets                = remove

sp_arith                          = force
sp_after_cast                     = force
sp_before_assign                  = force
sp_after_assign                   = force
sp_before_sparen                  = remove
sp_paren_empty                    = remove
sp_compare                        = force

sp_conditional_expr               = remove
sp_before_range_colon             = force

sp_ptr_star_left                  = force
sp_ptr_star_right                 = remove
sp_ptr_amp_left                   = force
sp_ptr_amp_right                  = remove

# ============================================================
# Alignment
# ============================================================
align_assign_span                 = 1
align_var_def_span                = 1
align_var_def_star_style          = 0
align_enum_equ_span               = 1
align_right_cmt_span              = 1

align_func_params                 = true
align_func_proto_span             = 1
align_oc_decl_colon               = true

# ============================================================
# Line breaking
# ============================================================
nl_after_func_proto               = force
nl_after_func_body                = force
nl_before_if                      = ignore
nl_before_for                     = ignore
nl_before_while                   = ignore

# ============================================================
# Short constructs
# ============================================================
nl_short_if                       = remove
nl_short_loop                     = remove
nl_short_func_def                 = remove

# ============================================================
# Includes
# ============================================================
include_category                 = true
include_sort                     = true

# ============================================================
# Column limit
# ============================================================
code_width                        = 128
ls_for_split_full                 = true
ls_func_split_full                = true

# ------------------------------------------------
# Preserve blank lines around comments
# ------------------------------------------------
nl_before_comment            = ignore
nl_after_comment             = ignore
nl_comment_func_def          = ignore
nl_comment_var_def           = ignore
nl_comment_before_brace      = ignore

# ------------------------------------------------
# Do not eat blank lines near braces / blocks
# ------------------------------------------------
eat_blanks_after_open_brace  = false
eat_blanks_before_close_brace = false

# ------------------------------------------------
# General blank-line policy
# ------------------------------------------------
nl_keep_blank_lines          = 1
nl_max                       = 2
disable_processing_cmt = true